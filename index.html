<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Matemática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="tela-inicial" class="tela ativa">
    <h1>Jogo de Matemática 🧮</h1>
    <button id="btn-comecar">Começar Jogar</button>
  </div>

  <div id="tela-nome" class="tela">
    <h2>Digite seu nome</h2>
    <input type="text" id="nome-jogador" placeholder="Seu nome..." />
    <button id="btn-iniciar">Iniciar</button>
  </div>

  <div id="tela-jogo" class="tela">
    <div id="info">
      <p><b>Jogador:</b> <span id="nome-exibir"></span></p>
      <p><b>Pontuação:</b> <span id="pontuacao">0</span></p>
      <p><b>Questão:</b> <span id="num-questao">1</span>/10</p>
    </div>
    <div id="pergunta-container">
      <h2 id="pergunta"></h2>
      <div id="alternativas"></div>
      <p id="dica"></p>
    </div>
  </div>

  <div id="tela-final" class="tela">
    <h2>Fim de Jogo!</h2>
    <p id="pontuacao-final"></p>
    <h3>Ranking</h3>
    <ol id="ranking-list"></ol>
    <button id="btn-reiniciar">Jogar Novamente</button>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="script.js"></script>
</body>
</html>
